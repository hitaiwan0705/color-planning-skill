name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 第一道：學生資料與機密不得進入 repo（失敗即擋 merge）
      - name: 學生資料外洩檢查
        run: python3 tools/validation/check_no_student_data.py

      # 第二道：決定性工具必須通過驗證，否則其輸出不得用於評分或研究
      - name: CIEDE2000 驗證套件
        run: |
          cd tools/color/tests
          python3 test_ciede2000.py --report test_report.md

      # 第三道之一：契約自身的內部一致性
      # 2026-09-06 實測：把五個契約違規植入 COURSE-CONTRACT.yaml，當時的四道關卡
      # 一個都沒抓到。那五項正是每次改契約時用臨時腳本手動驗的東西——臨時腳本
      # 不持久、不在 CI，下一個改契約的人不會跑。
      - name: 契約內部一致性檢核
        run: python3 tools/validation/check_contract.py

      # 第三道之二：涵蓋範圍不得窄於 iPAS 初級三科（global_rules.scope_floor）
      # 這條規則原本只寫在契約裡，沒有執行者；2026-09-06 靠人工比對官方簡章
      # 才發現 14 條細目缺口。有規則而無執行者，等於沒有規則。
      - name: 涵蓋範圍下限檢核
        run: python3 tools/validation/check_scope_floor.py

      # 第三道之三：CONTEXT.md 自己寫著「上限 150 行」，但沒有東西在數。
      # 2026-09-06 一輪之內被超過三次，三次都靠人工發現。上限的意義不在數字，
      # 在於它強迫「這件事該不該進 CONTEXT.md」被問出來——沒有執行者就不會被問。
      - name: 檔案長度上限檢核
        run: python3 tools/validation/check_file_budgets.py

      - name: repo 層檢核器自身的驗證套件
        run: python3 -m unittest discover -s tools/validation/tests -v

      # 第四道：教材與契約必須一致（週次覆蓋、重複週次、判準章節、設備閘門、數值來源）
      - name: 教材確定性檢核
        run: python3 tools/materials/scripts/check_materials.py

      - name: 教材檢核器自身的驗證套件
        run: python3 -m unittest discover -s tools/materials/tests -v

      - name: 上傳測試報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciede2000-test-report
          path: tools/color/tests/test_report.md
