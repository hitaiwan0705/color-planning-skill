# Claude Code GitHub Action
#
# 基準範例取自官方 repo，未憑記憶生成：
#   https://raw.githubusercontent.com/anthropics/claude-code-action/main/examples/claude.yml
#
# 相對官方範例，本檔增加一項改動：**發話者身分閘門**。
# 理由：本 repo 為 public，官方範例的觸發條件不限制發話者，
# 任何人在 issue 或 PR 留言 @claude 都會啟動並消耗授課者的訂閱用量。
#
# 注意實作細節：每個事件的身分檢查必須綁在「發出該次觸發的物件」上。
# issue_comment 事件中 github.event.issue.author_association 是**開票者**的身分，
# 不是留言者的——若用它做閘門，任何人只要在擁有者開的票下留言即可繞過。
# 故下方逐一配對 comment/review/issue 各自的 author_association。

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # 走 Pro/Max 訂閱的 OAuth token，非 API 額度計費。
          # token 由本機 `claude setup-token` 產生後存入 GitHub Secrets。
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
