    # ── Block B：傳播色彩系統（5 個主題週 + 3 個設備站週，共 7 週授課）──
    # OPT-A 裁決後：觀察基底為學生自己的實體輸出，TASK-06 與 TASK-07 共用同一組樣本。
    #
    # 授課者裁示 D5（2026-09-06）：week 10 起以**傳播為主體**，含概念與實作。
    # 因此本 block 每一週都是「傳播問題 → 感知或量測證據」，不是「感知知識 → 順帶提傳播」。
    # 每週 focus 的第一項為該週的傳播概念，其餘為支撐它的觀察或量測實作。
    # 感知內容沒有被刪減，位置改了：它從主題降為證據來源。
    - week: 10
      block: B
      title: 傳播色彩系統的問題設定：訊息、閱聽人與接觸點
      focus:
        - 概念：一則訊息在不同接觸點上，色彩各自負責什麼傳播功能（辨識、區隔、警示、層級、情緒定調）
        - 概念：接觸點不是通路清單，是「媒介 × 觀看條件 × 色彩空間」的三欄描述；缺任一欄的接觸點無法判定失效
        - 實作：為自選訊息列出至少三個接觸點並填完三欄，產出接觸點—訊息—色彩功能對照表初稿
        - 證據基礎：儀器判定相同、人眼判定不同的四個來源（同色異譜、觀察者差異、觀察條件、適應狀態）——這四個就是接觸點失效的機制清單
        - S1 觀察基底的色票登錄：登錄的是自己接下來要輸出、且已寫進對照表的那組色
      layer_refs: [1, 2, 3, 4]
      issue: [ASSIGN-03]
      due: []
      equipment_required: [light_booth_d50_d65, i1_pro_2, i1_pro_3]
      equipment_gate: "同色異譜示範限用 D50／D65；依賴螢光燈管之演示標 <!-- BLOCKED: 待設備確認 -->"
      observation_stage: 併入 ASSIGN-03 或 ASSIGN-04 之觀察資料，本週不另交件
    - week: 11
      block: B
      title: 接觸點的觀看情境：同一個色在不同場合被看成不同的訊息
      focus:
        - 概念：品牌色的「一致」是規範上的一致，不是視覺上的一致；接觸點的背景與環境光會改寫閱聽人看到的訊息
        - 概念：以適應機制、後像、色恆常失效與同時對比解釋位移的來源，並區分「規範沒守住」與「守住了但看起來仍不同」
        - 實作：把同一組品牌色放進兩種背景與兩種適應狀態，記錄判讀位移，標到對照表對應的接觸點上
        - crispening 對色差判定的影響：容差訂在哪個背景下量，結論會不同
      layer_refs: [1, 3]
      issue: []
      due: []
      equipment_required: [light_booth_d50_d65]
      observation_stage: 併入 ASSIGN-03 或 ASSIGN-04 之觀察資料，本週不另交件
      note: 本週為 OPT-A 壓縮後的合併週，原為兩週。授課節奏須留意，不得兩個主題各講一半
    - week: 12
