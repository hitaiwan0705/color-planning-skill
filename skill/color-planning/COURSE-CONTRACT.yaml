      title: 把客戶與閱聽人的話翻成可操作的色彩規格
      focus:
        - 概念：「再亮一點」「太濁了」「不夠有精神」是傳播現場的原始需求；規範書不能照抄，必須指名改的是哪一個色貌屬性
        - 實作：明度／明亮度／彩度／飽和度／色度分欄登錄，逐欄對應到一句需求語，不得互相代替
        - 絕對量與相對量的分界：跨接觸點比較時只有相對量可比，寫錯欄位等於寫錯規範
        - 色貌現象在跨媒體情境下的出現位置，對照上週的位移紀錄
      layer_refs: [1, 3]
      issue: []
      due: []
