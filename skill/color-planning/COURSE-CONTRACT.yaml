# COURSE-CONTRACT.yaml — 色彩規劃與傳播應用｜七項契約
#
# 七項契約集中於本檔，不拆成多個 schema（CONTEXT.md 第 6 節第 3 條）。
# 本檔為課程契約：欄位結構、必填規則、驗證邏輯、失敗條件與課程實質內容。
#
# 執行指令見 SKILL.md。已定案事實見 CONTEXT.md，衝突時以 CONTEXT.md 為準。

meta:
  course_name: 色彩規劃與傳播應用
  institution: 中國文化大學 資訊傳播學系
  level: 大三上
  required: true
  version: 0.1.0-content-filled
  status: content_filled    # skeleton | content_filled | classroom_ready
  classroom_ready: false    # 設備未確認項與交接草案仍須授課者核定
  context_source: CONTEXT.md
  skill_source: skill/color-planning/SKILL.md

# 全域必填規則：任一違反即本檔無效
global_rules:
  abstract_verbs_forbidden:
    # 能力描述不得使用下列詞彙，須編譯為五段式
    forbidden: [understand, apply, integrate, 理解, 應用, 整合, 熟悉, 掌握]
    replacement_form: [input_evidence, observable_behavior, deliverable, validation_rule, failure_condition]
    scope: 僅適用於 capability_contract.capabilities 之 input_evidence、observable_behavior、deliverable、validation_rule、failure_condition 欄位；課程名稱、專有名詞不適用
  external_fact_rule: 涉及外部事實者必須附可查證連結，查不到即標 UNVERIFIED，不得寫成肯定句
  equipment_rule: 僅得使用 CONTEXT.md 第 2 節已確認之設備；標 ⚠️ 或未定者相關活動標 BLOCKED
  scope_floor: 涵蓋範圍不得窄於 iPAS 初級三科（色彩學／色彩計畫實務／色彩管理）
  todo_marker: TODO(codex)
  blocked_marker: "<!-- BLOCKED: 待設備確認 -->"

# ── 契約 1｜能力契約 ─────────────────────────────────────────────
# 學生最後能獨立完成什麼。每條能力必須五段式，缺任一段即該條無效。
capability_contract:
  encoding_rule:
    required_fields: [id, layer, input_evidence, observable_behavior, deliverable, validation_rule, failure_condition]
    id_pattern: "CAP-[0-9]{2}"
    layer_range: [1, 6]
    failure_condition: 任一必填欄位缺漏、為空、或使用 global_rules.abstract_verbs_forbidden 所列詞彙

  ipas_alignment:
    source: CONTEXT.md 第 4 節
    source_url: https://ipd.nat.gov.tw/ipas/certification/CPM/exam-info
    rule: 每一科至少須對應一個 CAP 與一個 TASK；任一科無對應即觸發 E-SCOPE
    subjects:
      - subject: 科目一 色彩學
        capability_refs: [CAP-01, CAP-02, CAP-04]
        task_refs: [TASK-01, TASK-02, TASK-04]
        coverage_basis: 色彩知覺、色彩表徵、標準光源、觀察條件與 CIEDE2000 色差證據
        verification_rule: CAP/TASK 產物須含知覺風險表、色彩表徵對照表、量測條件表與 ΔE00 報告
        gap_note: 若 iPAS 115 年度正式簡章列出本表未含之色彩學細目，須補列；目前僅依 CONTEXT.md 已查證三科名稱比對
      - subject: 科目二 色彩計畫實務
        capability_refs: [CAP-02, CAP-03, CAP-06]
        task_refs: [TASK-02, TASK-03, TASK-06]
        coverage_basis: design token、色彩意象決策、候選色票取捨、媒介輸出限制與修正再輸出紀錄
        verification_rule: CAP/TASK 產物須含 design_token_table、色彩意象決策表、候選色票取捨紀錄與虛實輸出鏈路包
        gap_note: "<!-- UNVERIFIED: 科目二作答方式與是否配發實體色票須以 115 年正式簡章條文核對 -->"
      - subject: 科目三 色彩管理
        capability_refs: [CAP-04, CAP-05, CAP-06]
        task_refs: [TASK-04, TASK-05, TASK-06]
        coverage_basis: i1 Pro 量測、顯示器 OS 層 ICC、指定工作色域、軟打樣、媒材/設備描述檔與輸出後量測
        verification_rule: CAP/TASK 產物須含 i1_pro_measurement_file、i1Profiler_calibration_record、OS_ICC_profile_record、soft_proof_record 與 DeltaE00_before_after_report
        gap_note: 若 iPAS 115 年度正式簡章列出本表未含之色彩管理細目，須補列；目前僅依 CONTEXT.md 已查證三科名稱比對
    failure_condition: 任一 subject 缺 capability_refs、task_refs、verification_rule，或把 UNVERIFIED 項寫成肯定句 → E-SCOPE

  capabilities:
    # 涉及 ⚠️ 設備者，failure_condition 前加 blocked_marker。
    - id: CAP-01
      layer: 1
      input_evidence: 指定色票、前景背景組合、版面截圖、刺激條件、觀察者紀錄、AI 使用揭露
      observable_behavior: 標出色適應、同時對比、連續對比與色覺差異可能改變判讀的位置，並分開記錄 WCAG 對比與 SC 1.4.1「僅以顏色傳達」檢核
      deliverable: 色彩知覺風險表、觀察條件紀錄、色覺差異風險清單、SC 1.4.1 人工檢核表
      validation_rule: 每一筆風險須連到截圖座標或色票 ID；對比數值須可追溯至 color_audit.py；SC 1.4.1 不得以對比數值代替；WCAG 2.2 來源註記 https://www.w3.org/TR/WCAG22/
      failure_condition: 缺任一交付物、以主觀喜好代替觀察條件、或把對比通過寫成 SC 1.4.1 通過 → 未通過
    - id: CAP-02
      layer: 2
      input_evidence: 色票清單、原始設計檔、色彩空間宣告、ICC profile、工具輸出 JSON、AI 使用揭露
      observable_behavior: 將同一色票以 CIE XYZ、CIELAB、LCh、RGB、CMYK、OKLCH 中任務指定格式記錄，標明來源 profile 與不可直接比較的跨空間欄位
      deliverable: design token 表、色彩表徵對照表、色彩空間與 profile 版本紀錄、工具輸出附件
      validation_rule: 每個 token 須有唯一 ID、色彩空間、數值、來源檔、profile 名稱與版本；跨空間轉換須保留工具輸出或軟體匯出紀錄；不得以 Pantone 作為色彩科學起點
      failure_condition: token 缺 ID 或 profile、RGB/CMYK/Lab 數值未標來源、或跨色彩空間直接比較未註記限制 → 未通過
    - id: CAP-03
      layer: 3
      input_evidence: 品牌或傳播情境簡報、受眾描述、語意差異量表、文化語境資料、候選色票、AI 使用揭露
      observable_behavior: 將意象詞彙與品牌人格對應到候選色票，記錄保留與排除理由，並標出文化語境風險
      deliverable: 色彩意象決策表、語意差異摘要、候選色票取捨紀錄、文化語境風險註記
      validation_rule: 每個入選色須至少連到一筆意象證據與一筆排除替代色理由；外部文化或標準事實須附來源，查不到須標 UNVERIFIED
      failure_condition: 只寫情緒形容詞而無證據、未列替代色排除理由、或將未查證文化意義寫成肯定句 → 未通過
    - id: CAP-04
      layer: 4
      input_evidence: 實體樣本、i1 Pro 2 或 i1 Pro 3 量測檔、標準光源紀錄、觀察角度、儀器型號、AI 使用揭露
      observable_behavior: 在指定光源與觀察條件下量測樣本，使用 CIEDE2000 報告色差，並把視覺觀察與儀器紀錄分欄
      deliverable: 原始量測檔、量測條件表、ΔE00 報告、視覺觀察紀錄、異常值處理紀錄
      validation_rule: 每個 ΔE00 數值須可追溯至 i1 Pro 量測檔或 color_audit.py；報告須註明 CIEDE2000 公式版本，不得與 CIE76 混用；D50/D65 燈箱可用但型號等級不得肯定
      failure_condition: 缺原始量測檔、量測條件未載光源或觀察角度、以目測代替 ΔE00、或宣稱未核對之燈箱等級 → 未通過
    - id: CAP-05
      layer: 5
      input_evidence: 顯示器型號、i1Profiler 校正紀錄、OS 層 ICC profile、工作色域設定、軟打樣截圖、AI 使用揭露
      observable_behavior: 以 i1 Pro 2 或 i1 Pro 3 搭配 i1Profiler 建立 OS 層顯示器 ICC profile，指定工作色域，記錄軟打樣與色域映射設定
      deliverable: 顯示器校正紀錄、ICC profile 檔名與版本表、工作色域設定表、軟打樣設定表、色域外色彩清單
      validation_rule: 顯示器須限 BenQ PD2705Q 或 PD2706QN；校色路徑須為 i1Profiler 到 OS 層 ICC；不得寫入 monitor LUT 或宣稱 AQCOLOR Pilot 硬體校色；BenQ/X-Rite 來源見 CONTEXT.md 第 2 節連結
      failure_condition: 缺 ICC profile、未載工作色域、將軟體校色寫成硬體校色、或使用 CONTEXT.md 未列顯示器 → 未通過
    - id: CAP-06
      layer: 6
      input_evidence: 原始設計檔、工作色域設定、顯示器 ICC、軟打樣紀錄、Mimaki 輸出設定、媒材/設備描述檔、實體樣本、燈箱觀察紀錄、i1 Pro 量測檔、修正紀錄、AI 使用揭露
      observable_behavior: 依序完成數位設計、顯示器校正、指定工作色域、軟打樣、媒材/設備描述檔記錄、Mimaki 實體輸出、D50/D65 燈箱觀察、儀器量測、視覺評估、修正再輸出
      deliverable: 虛實輸出鏈路包、第一次輸出樣本、修正後輸出樣本、ΔE00 前後比較報告、視覺評估表、再輸出修改紀錄
      validation_rule: 鏈路十步驟不得缺項或改序；Mimaki 輸出不得超過 300×420 mm 與 50 mm 厚度；媒材名稱若未由授課者確認，該媒材指定須標 BLOCKED；白墨、clear 或螢光燈管活動須標 BLOCKED
      failure_condition: 缺任一鏈路證據、未交修正後樣本、未載媒材/設備描述檔、或使用未確認白墨/clear/TL84 做肯定教學 → 未通過

# ── 契約 2｜任務契約 ─────────────────────────────────────────────
# 在什麼情境、限制與角色下完成。
task_contract:
  encoding_rule:
    required_fields: [id, capability_refs, scenario, role, constraints, equipment_required, duration, submission_channel]
    id_pattern: "TASK-[0-9]{2}"
    validation_rule: capability_refs 必須指向存在的 CAP id；equipment_required 每項須在 CONTEXT.md 第 2 節出現
    failure_condition: 參照不存在的能力、或要求 CONTEXT.md 未記載之設備 → 該任務作廢

  equipment_gate:
    # 對應 SKILL.md 第 2 節。狀態為 unverified 者，相關任務必須標 BLOCKED。
    confirmed:
      - i1_pro_2
      - i1_pro_3
      - mimaki_ujf_3042fx_body
      - benq_pd2705q
      - benq_pd2706qn
      - display_profiling_via_i1profiler  # i1 Pro 2/3 + i1Profiler → OS 層 ICC
      - light_booth_d50_d65
    unverified:
      - light_booth_model         # 研判為 Judge QC，須核對機身銘牌
      - judge_qc_fluorescent_lamp # CWF／TL84／U30 未確認，同色異譜活動依賴此項
      - mimaki_white_clear_ink    # 白墨與 clear 是否已安裝未確認
    unavailable:
      # 已查證確定不具備者。標此類之活動一律 BLOCKED，且不得以「待確認」表述。
      - monitor_hardware_calibration  # PD 系列僅 software calibration，硬體校色限 SW 系列
    undecided: [teaching_venue]
    rule: 任務之 equipment_required 若含 unverified、unavailable 或 undecided 項目，必須標 blocked_marker

  tasks:
    - id: TASK-01
      capability_refs: [CAP-01]
      scenario: 檢查資訊圖表或品牌版面中的色彩知覺風險，分別處理色適應、對比、色覺差異與 WCAG SC 1.4.1
      role: 色彩規劃稽核者
      constraints: 不得以個人偏好作為判斷；對比數值須由 color_audit.py 產生；SC 1.4.1 以人工檢核表記錄
      equipment_required: []
      duration: 1-2 週
      submission_channel: 課程指定 LMS 或授課者指定之 repo 交件位置
    - id: TASK-02
      capability_refs: [CAP-02]
      scenario: 將傳播設計色票轉成可交換的色彩資料與 design token，標明色彩空間、profile 與版本
      role: 色彩資料建檔者
      constraints: 主線須從 CIE XYZ 到 CIELAB/LCh 到 ΔE 到 ICC；Pantone 只能作為產業溝通或色票指定欄位
      equipment_required: []
      duration: 1-2 週
      submission_channel: 課程指定 LMS 或授課者指定之 repo 交件位置
    - id: TASK-03
      capability_refs: [CAP-03]
      scenario: 為品牌或傳播情境建立色彩意象決策表，將語意差異、文化語境與候選色票連成證據鏈
      role: 色彩計畫提案者
      constraints: 外部文化、標準或產業事實須附連結；查不到須標 UNVERIFIED；不得把 AI 產生內容寫成事實來源
      equipment_required: []
      duration: 2 週
      submission_channel: 課程指定 LMS 或授課者指定之 repo 交件位置
    - id: TASK-04
      capability_refs: [CAP-04]
      scenario: 以 i1 Pro 2 或 i1 Pro 3 量測實體樣本，在 D50/D65 標準燈箱下記錄視覺觀察，產出 ΔE00 報告
      role: 色彩量測記錄者
      constraints: 燈箱可使用 D50/D65；型號與等級須寫「待核對」；不得假設 TL84、CWF 或 U30 存在
      equipment_required: [i1_pro_2, i1_pro_3, light_booth_d50_d65]
      duration: 2 週
      submission_channel: 課程指定 LMS 或授課者指定之 repo 交件位置
    - id: TASK-05
      capability_refs: [CAP-05]
      scenario: 對 BenQ PD2705Q 或 PD2706QN 走 i1Profiler 到 OS 層 ICC 的顯示器校正與軟打樣設定
      role: 色彩管理操作者
      constraints: 只允許 software calibration；不得寫入 monitor LUT；不得使用 AQCOLOR Pilot 作為本課校色路徑
      equipment_required: [benq_pd2705q, benq_pd2706qn, display_profiling_via_i1profiler, i1_pro_2, i1_pro_3]
      duration: 2 週
      submission_channel: 課程指定 LMS 或授課者指定之 repo 交件位置
    - id: TASK-06
      capability_refs: [CAP-06]
      scenario: 完成虛實輸出完整鏈：數位設計 → 顯示器校正 → 指定工作色域 → 軟打樣 → 媒材/設備描述檔 → 實體輸出 → 標準燈箱觀察 → 儀器量測 → 視覺評估 → 修正再輸出
      role: 虛實輸出品質記錄者
      constraints: "Mimaki UJF-3042FX 輸出不得超過 300×420 mm 與 50 mm 厚度；不得指定 CONTEXT.md 未確認媒材；白墨、clear、螢光燈管與固定教室配置相關活動一律標 <!-- BLOCKED: 待設備確認 -->"
      equipment_required: [mimaki_ujf_3042fx_body, light_booth_d50_d65, i1_pro_2, i1_pro_3, benq_pd2705q, benq_pd2706qn, display_profiling_via_i1profiler]
      duration: 3-4 週
      submission_channel: 課程指定 LMS 或授課者指定之 repo 交件位置

  schedule_constraint:
    # 由 CONTEXT.md 第 4 節導出，非課程內容，Codex 不得更動。
    exam_date: 2026-11-14
    rule: iPAS 考科對應內容須於 2026-11-14 前授畢
    coverage_before_exam:
      required_for_ipas_subjects:
        - subject: 科目一 色彩學
          task_refs: [TASK-01, TASK-02, TASK-04]
        - subject: 科目二 色彩計畫實務
          task_refs: [TASK-02, TASK-03]
          post_exam_reinforcement: TASK-06
          unverified_note: "<!-- UNVERIFIED: 科目二作答方式與是否須完整實體輸出鏈，須以 115 年正式簡章條文核對 -->"
        - subject: 科目三 色彩管理
          task_refs: [TASK-04, TASK-05]
          post_exam_reinforcement: TASK-06
      post_exam_reinforcement_tasks: [TASK-06]
      feasibility_status: requires_instructor_scheduling
      failure_condition: 若 TASK-01 至 TASK-05 無法於 2026-11-14 前授畢，須標需授課者裁決；不得宣稱已滿足考前涵蓋
    registration_note: 報名極可能於開學一至兩週內截止，報考決定須於第 1 週處理
    unverified_note: 報名期間與團體報名截止日須以 115 年度初級簡章條文為準

# ── 契約 3｜評量契約 ─────────────────────────────────────────────
# 如何判斷品質與能力層級。本 skill 產生落差清單，不產生分數。
assessment_contract:
  principle: skill 輸出證據落差清單；分數由授課者裁決（SKILL.md 第 1 節）
  levels:
    # 禁止以「優／良／可」等無操作定義之詞彙作為層級名稱。
    - id: LEVEL-01
      name: evidence_missing
      observable_standard: 缺 required_artifacts.always 任一項，或缺對應任務交付物
      output_rule: gap_entry code 使用 unsupported_claim、partial_input、disclosure_missing 或 blocked_by_equipment
      failure_condition: 不得輸出分數、等第或總評語
    - id: LEVEL-02
      name: evidence_present_not_traceable
      observable_standard: 交付物存在，但數值、profile、量測條件或視覺評估無法追溯到工具輸出、ICC 檔、儀器檔或截圖位置
      output_rule: gap_entry traceable_to 填 null，並列 evidence_expected 與 evidence_found
      failure_condition: 不得以文字說明補足缺少的原始檔或工具輸出
    - id: LEVEL-03
      name: traceable_with_gaps
      observable_standard: 主要證據可追溯，但仍有設備狀態、AI 使用揭露、SC 1.4.1 人工檢核或修正紀錄缺口
      output_rule: 逐項列出 gap code，不合併成單一總評
      failure_condition: 不得把未確認設備活動標為已完成
    - id: LEVEL-04
      name: traceable_complete
      observable_standard: 必要證據齊全、數值可追溯、設備閘門通過、AI 使用揭露存在，且未對研究等級或設備等級作超出 CONTEXT.md 的宣稱
      output_rule: gaps 可為空陣列，但仍須列 checks 與 disclosure_status
      failure_condition: 輸出任何分數或推定研究成效即作廢

  output_format:
    required_fields: [artifact_id, checks, gaps, unsupported_claims, disclosure_status]
    gap_entry_fields: [code, evidence_expected, evidence_found, traceable_to]
    allowed_codes:
      - unsupported_claim      # 數值主張無法追溯
      - contradicted_by_tool   # 與工具複算結果不一致
      - disclosure_missing     # 未揭露 AI 使用
      - not_assessable_without_visual
      - partial_input
      - blocked_by_equipment
    failure_condition: 輸出含分數、等第或總評語 → 違反 principle，該輸出作廢

  rubric_dimensions:
    # 維度與權重尚未決定（CONTEXT.md 第 8 節），填入前須先取得授課者裁決。
    status: undecided_by_instructor

# ── 契約 4｜證據契約 ─────────────────────────────────────────────
# 每個主張需要什麼證據。缺項即未通過，不得補償。
evidence_contract:
  required_artifacts:
    # 不論是否啟用研究層皆須保留（CONTEXT.md 第 6 節、SKILL.md 第 7 節）
    always:
      - task_version
      - color_space_declared
      - device_and_calibration_state
      - icc_profile
      - measurement_conditions   # 光源、觀察角度、儀器型號
      - output_result
      - revision_rationale
      - assessment_evidence
      - ai_usage_disclosure
    per_task:
      - task_id: TASK-01
        artifacts: [版面截圖, 色彩知覺風險表, 色覺差異風險清單, SC_1_4_1_人工檢核表, color_audit_json]
      - task_id: TASK-02
        artifacts: [design_token_table, 色彩表徵對照表, ICC_profile_version_record, 色票版本紀錄, color_audit_json]
      - task_id: TASK-03
        artifacts: [色彩意象決策表, 語意差異摘要, 候選色票取捨紀錄, 文化語境來源清單, AI_usage_disclosure]
      - task_id: TASK-04
        artifacts: [i1_pro_measurement_file, 量測條件表, DeltaE00_report, 燈箱觀察紀錄, 異常值處理紀錄]
      - task_id: TASK-05
        artifacts: [i1Profiler_calibration_record, OS_ICC_profile_record, working_space_setting, soft_proof_setting, out_of_gamut_color_list]
      - task_id: TASK-06
        artifacts: [原始設計檔, 顯示器校正紀錄, working_space_setting, soft_proof_record, media_device_profile_record, first_physical_sample, revised_physical_sample, D50_D65_light_booth_observation, i1_pro_measurement_file, DeltaE00_before_after_report, visual_evaluation_form, revision_output_log]

  traceability_rule:
    statement: 每個數值主張須追溯至 color_audit.py 輸出或儀器量測檔
    accepted_sources: [color_audit_json, i1_pro_measurement_file, instructor_reference_sample]
    failure_condition: 無法追溯 → 標 unsupported_claim，不得以「經驗判斷」代替

  completeness_rule:
    statement: required_artifacts.always 缺任一項即未通過
    compensation_allowed: false

# ── 契約 5｜工具契約 ─────────────────────────────────────────────
# 哪些判斷必須由程式或儀器完成。
tool_contract:
  principle: 決定性計算交由工具；LLM 負責解讀、教學與批判（CONTEXT.md 第 6 節第 8 條）

  must_use_tool_for:
    - 兩色是否可區辨或視為同色
    - 前景背景對比是否符合 WCAG
    - 色票在色覺差異下是否混淆
    - 任何寫入評量、報告或研究的數值

  tools:
    color_audit:
      path: tools/color/scripts/color_audit.py
      invocations:
        palette: python3 tools/color/scripts/color_audit.py --palette "#RRGGBB,..." --json
        pair: python3 tools/color/scripts/color_audit.py --pair "#前景" "#背景" --json
      output_keys_pair: [foreground, background, wcag.ratio, wcag.AA_normal_text_4.5, wcag.AA_large_text_3.0, wcag.AA_non_text_3.0, wcag.AAA_normal_text_7.0, wcag.AAA_large_text_4.5, cvd_contrast.protan, cvd_contrast.deutan, cvd_contrast.tritan, cvd_contrast.grayscale]
      output_keys_palette: [palette, min_delta_e_threshold, scenarios.worst_pair.delta_e00, scenarios.worst_pair.confusable, scenarios.confusable_count]
      validation_status:
        reference_tests: 7/34
        property_tests: 8/8
        research_grade_use: not_approved
        classroom_demo_use: conditionally_approved
        rule: 不得宣稱完整驗證；不得用於研究等級主張

  not_covered_by_tool:
    # 工具不檢測者，須另以人工檢核，且不得以工具輸出宣稱已滿足
    - wcag_sc_1_4_1_color_alone
    - 實體樣本外觀與材質觀感
    - 版面與圖形語意

  instrument_use:
    i1_pro:
      models: [i1 Pro 2, i1 Pro 3]
      required_record: [光源, 觀察角度, 儀器型號, 量測日期]
      failure_condition: 量測紀錄缺任一必填欄位 → 該量測結果不得引用

  delta_e_rule:
    formula: CIEDE2000
    citation_required: true
    forbidden: 與 CIE76 混用

# ── 契約 6｜課程交接契約 ─────────────────────────────────────────
# 前後課程交換哪些具體產物。寫產物，不寫能力描述。
handoff_contract:
  position:
    # 依 CONTEXT.md 第 1 節：上游皆早於本課，下游皆晚於本課
    upstream: [認知心理學（大一上）, 人機互動（大二上）]
    downstream:
      - 資訊視覺化設計（大三下）
      - 品牌策略與跨媒體整合專題（大三下，就業學程）
      - 整合行銷傳播（大四上）
      - 畢業專題（大四上）
    rule: 本課只承接上游、只交付下游，不預設同期課程產出

  encoding_rule:
    required_fields: [to_course, artifact_name, format, produced_by_task, consumed_for, status]
    status_values: [draft, ratified]
    validation_rule: artifact_name 須為具體檔案或文件，不得為能力描述
    failure_condition: 出現「具備某某能力」形式之交接項 → 該項作廢，重寫為產物

  drafting_authority:
    # 授課者裁決（2026-08-04）：交接產物由 Codex 提草案，授課者核定。
    codex_may_draft: true
    codex_must_set_status: draft
    ratified_by: instructor_only
    failure_condition: Codex 產出之交接項 status 非 draft，或自行標為 ratified → 該項作廢
    note: status 為 draft 者不得寫入其他契約作為前提，也不得據以產生任務

  handoffs:
    # 下游四門課（資訊視覺化設計、品牌策略與跨媒體整合專題、整合行銷傳播、
    # 畢業專題）至少各一項。核定前不得被其他契約引用。
    - to_course: 資訊視覺化設計（大三下）
      artifact_name: design_token_table.json + DeltaE00_audit_report.md + SC_1_4_1_checklist.md
      format: JSON + Markdown
      produced_by_task: TASK-02/TASK-04/TASK-06
      consumed_for: 資訊視覺化設計讀取 token ID、色彩空間、對比結果、CIEDE2000 色差與色覺差異風險後，用於類別色、序列色、警示色與前景背景組合的視覺編碼決策
      status: draft
    - to_course: 品牌策略與跨媒體整合專題（大三下，就業學程）
      artifact_name: brand_color_decision_table.md + color_intent_source_list.md + profile_version_log.csv
      format: Markdown + CSV
      produced_by_task: TASK-03/TASK-05
      consumed_for: 品牌策略課讀取意象詞彙、受眾語境、候選色排除理由與 profile 版本後，用於品牌識別規範、跨媒體素材色彩指定與供應商溝通檔案
      status: draft
    - to_course: 整合行銷傳播（大四上）
      artifact_name: campaign_color_qc_packet.zip
      format: ZIP containing Markdown, JSON, ICC profile record, measurement files
      produced_by_task: TASK-01/TASK-04/TASK-06
      consumed_for: 整合行銷傳播課讀取色彩風險表、輸出鏈路、燈箱觀察與 ΔE00 前後比較後，用於多接觸點素材的輸出驗收、供應商回報與修正決策
      status: draft
    - to_course: 畢業專題（大四上）
      artifact_name: final_project_color_reproducibility_dossier.zip
      format: ZIP containing source file index, design tokens, ICC/profile log, soft proof record, measurement files, revision log
      produced_by_task: TASK-02/TASK-05/TASK-06
      consumed_for: 畢業專題讀取來源檔索引、token 表、ICC/profile 紀錄、軟打樣設定、實體輸出樣本紀錄與修正再輸出紀錄後，用於專題展覽輸出、口試展示檔與製作廠商交付規格
      status: draft

# ── 契約 7｜平台可攜契約 ─────────────────────────────────────────
# 在不同 LLM 上如何維持最低一致性。降級但不偽裝。
portability_contract:
  principle: 能力受限時降低宣稱強度，不得以估算冒充計算（SKILL.md 第 6 節）

  degradation_rules:
    no_code_execution:
      trigger: 環境無法執行 Python
      must_not: [計算研究等級指標, 提供未標記之數值結果]
      must_do:
        - 提供可重現之公式或可直接複製之腳本呼叫指令
        - 所有數值結果標記 unverified
      required_statement: 本環境無法執行量化稽核，以下僅為方向性判斷，不得作為評分或研究依據。

    no_visual_input:
      trigger: 環境無法接收影像
      must_not: [宣稱已目視檢查, 以文字描述替代數值色彩資料]
      must_do:
        - 要求提供 hex／Lab／量測檔等數值色彩資料
        - 涉及外觀之判斷標記 not_assessable_without_visual

    no_file_access:
      trigger: 環境無法讀取 repo 檔案
      must_not: [宣稱已審閱完整檔案]
      must_do:
        - 只索取完成當前判斷所需之最小必要片段，並說明理由
        - 輸出標記 partial_input 並列出未讀取部分

  common_rules:
    statement_position: 降級聲明置於輸出最前，不得置於結尾或註腳
    failure_condition: 降級但未輸出聲明 → E-DEGRADE，補上聲明並重新標記結果
    no_relaxation: 不得因降級而省略失敗條件判定；證據不足即為未通過，不是待補

  minimum_consistency:
    # 任何平台皆須維持
    - 設備閘門（SKILL.md 第 2 節）
    - 證據完整性檢查（evidence_contract.completeness_rule）
    - 失敗條件總表（SKILL.md 第 9 節）

# ── 研究層 overlay（可插拔，預設關閉）────────────────────────────
research_overlay:
  enabled: false
  note: 本 skill 不得自行開啟，也不得建議特定研究問題（SKILL.md 第 7 節）
  blocked_until: [研究問題確定, primary_outcome 確定, 倫理程序完成]
  additional_fields_when_enabled:
    - group_assignment
    - primary_outcome
    - pre_post_measures
    - consent_status
    - anonymous_id
  undecided_by_instructor:
    # 對應 CONTEXT.md 第 8 節
    - 研究問題與 primary outcome
    - IRB 送件時程
    - 評分規準的維度與權重
    - 前後課程的具體交接物
