# ── 契約 3｜評量契約 ─────────────────────────────────────────────
# 如何判斷品質與能力層級。本 skill 產生落差清單，不產生分數。
assessment_contract:
  principle: skill 輸出證據落差清單；分數由授課者裁決（SKILL.md 第 1 節）
  levels:
    # 禁止以「優／良／可」等無操作定義之詞彙作為層級名稱。
    - id: LEVEL-01
      name: evidence_missing
      observable_standard: 缺 required_artifacts.always 任一項，或缺對應任務交付物
      output_rule: gap_entry code 使用 unsupported_claim、partial_input、disclosure_missing 或 blocked_by_equipment
      failure_condition: 不得輸出分數、等第或總評語
    - id: LEVEL-02
      name: evidence_present_not_traceable
      observable_standard: 交付物存在，但數值、profile、量測條件或視覺評估無法追溯到工具輸出、ICC 檔、儀器檔或截圖位置
      output_rule: gap_entry traceable_to 填 null，並列 evidence_expected 與 evidence_found
      failure_condition: 不得以文字說明補足缺少的原始檔或工具輸出
    - id: LEVEL-03
      name: traceable_with_gaps
      observable_standard: 主要證據可追溯，但仍有設備狀態、AI 使用揭露、SC 1.4.1 人工檢核或修正紀錄缺口
      output_rule: 逐項列出 gap code，不合併成單一總評
      failure_condition: 不得把未確認設備活動標為已完成
    - id: LEVEL-04
      name: traceable_complete
      observable_standard: 必要證據齊全、數值可追溯、設備閘門通過、AI 使用揭露存在，且未對研究等級或設備等級作超出 CONTEXT.md 的宣稱
      output_rule: gaps 可為空陣列，但仍須列 checks 與 disclosure_status
      failure_condition: 輸出任何分數或推定研究成效即作廢

  output_format:
    required_fields: [artifact_id, checks, gaps, unsupported_claims, disclosure_status]
    gap_entry_fields: [code, evidence_expected, evidence_found, traceable_to]
    allowed_codes:
      - unsupported_claim      # 數值主張無法追溯
      - contradicted_by_tool   # 與工具複算結果不一致
      - disclosure_missing     # 未揭露 AI 使用
      - not_assessable_without_visual
      - partial_input
      - blocked_by_equipment
    failure_condition: 輸出含分數、等第或總評語 → 違反 principle，該輸出作廢

  rubric_dimensions:
    # 維度與權重仍列為 CONTEXT.md 第 8 節之未決事項。
    # 以下為草案，核定前不得作為評分依據，也不得被 skill 引用產生分數。
    status: draft
    drafted_by: claude
    ratified_by: instructor_only
    source: MATERIALS-PLAN.md 第 5 節
    scope_note: 本組維度供授課者評分使用；skill 本身仍不得輸出分數、等第或總評語
    gates:
      # 門檻不是權重維度。未過門檻者不進入權重計算，且不得以其他項目補償。
      - id: G1
        rule: evidence_contract.required_artifacts.always 齊全
        on_fail: 該次不計分，退回補件
      - id: G2
        rule: AI 使用揭露存在
        on_fail: disclosure_missing，該次不計分
      - id: G3
        rule: 每個數值主張可追溯至 color_audit.py 輸出或 i1 Pro 量測檔
        on_fail: unsupported_claim，該數值不採計
    profiles:
      - id: R-A
        applies_to: [TASK-02, TASK-04, TASK-05, TASK-06]
        dimensions:
          - {name: 可追溯性與量測紀錄品質, weight: 25}
          - {name: 規格符合度, weight: 25}
          - {name: 判斷的正當性, weight: 25}
          - {name: 修正迴圈證據, weight: 25}
      - id: R-B
        applies_to: [TASK-01, TASK-07, TASK-08]
        dimensions:
          - {name: 觀察條件紀錄完整性, weight: 25}
          - {name: 機制歸因與排除理由, weight: 30}
          - {name: 資料與工具輸出的一致性, weight: 25}
          - {name: 限制的誠實度, weight: 20}
    semester_weighting_draft:
      # OPT-A 裁決後重配（2026-09-05）。TASK-06 為全學期最重的實作，不得低於 20。
      TASK-02: 10
      TASK-03: 10
      TASK-04: 12
      TASK-05: 13
      TASK-06: 20
      TASK-07: 20
      TASK-01: 5
      TASK-08: 10
      total: 100
      note: TASK-06 與 TASK-07 共用樣本但分開計分——前者評輸出鏈的完整與可追溯，後者評觀察與歸因
      undecided:
        - P1–P7 的 20 分如何切分（等分或前輕後重）
        - 遲交與補件的扣分規則
        - TASK-01 降至 5 分是否過低（其交付物含 SC 1.4.1 人工檢核，工作量不小）
    failure_condition: skill 依本節產生分數、等第或總評語 → 該輸出作廢（assessment_contract.principle）

# ── 契約 4｜證據契約 ─────────────────────────────────────────────
# 每個主張需要什麼證據。缺項即未通過，不得補償。
evidence_contract:
  required_artifacts:
    # 不論是否啟用研究層皆須保留（CONTEXT.md 第 6 節、SKILL.md 第 7 節）
    always:
      - task_version
      - color_space_declared
      - device_and_calibration_state
      - icc_profile
      - measurement_conditions   # 光源、觀察角度、儀器型號
      - output_result
      - revision_rationale
      - assessment_evidence
      - ai_usage_disclosure
    per_task:
      - task_id: TASK-01
        artifacts: [版面截圖, 色彩知覺風險表, 色覺差異風險清單, SC_1_4_1_人工檢核表, color_audit_json]
      - task_id: TASK-02
        artifacts: [design_token_table, 色彩表徵對照表, ICC_profile_version_record, 色票版本紀錄, color_audit_json]
      - task_id: TASK-03
        artifacts: [色彩意象決策表, 語意差異摘要, 候選色票取捨紀錄, 文化語境來源清單, AI_usage_disclosure]
      - task_id: TASK-04
        artifacts: [i1_pro_measurement_file, 量測條件表, DeltaE00_report, 燈箱觀察紀錄, 異常值處理紀錄]
      - task_id: TASK-05
        artifacts: [i1Profiler_calibration_record, OS_ICC_profile_record, working_space_setting, soft_proof_setting, out_of_gamut_color_list]
      - task_id: TASK-06
        artifacts: [原始設計檔, 顯示器校正紀錄, working_space_setting, soft_proof_record, media_device_profile_record, first_physical_sample, revised_physical_sample, D50_D65_light_booth_observation, i1_pro_measurement_file, DeltaE00_before_after_report, visual_evaluation_form, revision_output_log]

      - task_id: TASK-07
        artifacts: [感知落差對照表, 觀察條件紀錄, 機制歸因說明, 排除理由紀錄, color_audit_json, i1_pro_measurement_file, 週次進度交件紀錄]
      - task_id: TASK-08
        artifacts: [報告本文, 原始資料檔, 外部來源清單, 限制章節, AI_usage_disclosure]

  traceability_rule:
    statement: 每個數值主張須追溯至 color_audit.py 輸出或儀器量測檔
    accepted_sources: [color_audit_json, i1_pro_measurement_file, instructor_reference_sample]
    failure_condition: 無法追溯 → 標 unsupported_claim，不得以「經驗判斷」代替

  completeness_rule:
    statement: required_artifacts.always 缺任一項即未通過
    compensation_allowed: false

# ── 契約 5｜工具契約 ─────────────────────────────────────────────
# 哪些判斷必須由程式或儀器完成。
tool_contract:
  principle: 決定性計算交由工具；LLM 負責解讀、教學與批判（CONTEXT.md 第 6 節第 8 條）

  must_use_tool_for:
    - 兩色是否可區辨或視為同色
    - 前景背景對比是否符合 WCAG
    - 色票在色覺差異下是否混淆
    - 任何寫入評量、報告或研究的數值

  tools:
    color_audit:
      path: tools/color/scripts/color_audit.py
      invocations:
        palette: python3 tools/color/scripts/color_audit.py --palette "#RRGGBB,..." --json
        pair: python3 tools/color/scripts/color_audit.py --pair "#前景" "#背景" --json
      output_keys_pair: [foreground, background, wcag.ratio, wcag.AA_normal_text_4.5, wcag.AA_large_text_3.0, wcag.AA_non_text_3.0, wcag.AAA_normal_text_7.0, wcag.AAA_large_text_4.5, cvd_contrast.protan, cvd_contrast.deutan, cvd_contrast.tritan, cvd_contrast.grayscale]
      output_keys_palette: [palette, min_delta_e_threshold, scenarios.worst_pair.delta_e00, scenarios.worst_pair.confusable, scenarios.confusable_count]
      validation_status:
        reference_tests: 7/34
        property_tests: 8/8
        research_grade_use: not_approved
        classroom_demo_use: conditionally_approved
        rule: 不得宣稱完整驗證；不得用於研究等級主張

  not_covered_by_tool:
    # 工具不檢測者，須另以人工檢核，且不得以工具輸出宣稱已滿足
    - wcag_sc_1_4_1_color_alone
    - 實體樣本外觀與材質觀感
    - 版面與圖形語意

  instrument_use:
    i1_pro:
      models: [i1 Pro 2, i1 Pro 3]
      required_record: [光源, 觀察角度, 儀器型號, 量測日期]
      failure_condition: 量測紀錄缺任一必填欄位 → 該量測結果不得引用

  delta_e_rule:
    formula: CIEDE2000
    citation_required: true
    forbidden: 與 CIE76 混用

# ── 契約 6｜課程交接契約 ─────────────────────────────────────────
# 前後課程交換哪些具體產物。寫產物，不寫能力描述。
handoff_contract:
  position:
    # 依 CONTEXT.md 第 1 節：上游皆早於本課，下游皆晚於本課
    upstream: [認知心理學（大一上）, 人機互動（大二上）]
    downstream:
      - 資訊視覺化設計（大三下）
      - 品牌策略與跨媒體整合專題（大三下，就業學程）
      - 整合行銷傳播（大四上）
      - 畢業專題（大四上）
    rule: 本課只承接上游、只交付下游，不預設同期課程產出

  encoding_rule:
    required_fields: [to_course, artifact_name, format, produced_by_task, consumed_for, status]
    status_values: [draft, ratified]
    validation_rule: artifact_name 須為具體檔案或文件，不得為能力描述
    failure_condition: 出現「具備某某能力」形式之交接項 → 該項作廢，重寫為產物

  drafting_authority:
    # 授課者裁決（2026-08-04）：交接產物由 Codex 提草案，授課者核定。
    codex_may_draft: true
    codex_must_set_status: draft
    ratified_by: instructor_only
    failure_condition: Codex 產出之交接項 status 非 draft，或自行標為 ratified → 該項作廢
    note: status 為 draft 者不得寫入其他契約作為前提，也不得據以產生任務

  handoffs:
    # 下游四門課（資訊視覺化設計、品牌策略與跨媒體整合專題、整合行銷傳播、
    # 畢業專題）至少各一項。核定前不得被其他契約引用。
    - to_course: 資訊視覺化設計（大三下）
      artifact_name: design_token_table.json + DeltaE00_audit_report.md + SC_1_4_1_checklist.md
      format: JSON + Markdown
      produced_by_task: TASK-02/TASK-04/TASK-06
      consumed_for: 資訊視覺化設計讀取 token ID、色彩空間、對比結果、CIEDE2000 色差與色覺差異風險後，用於類別色、序列色、警示色與前景背景組合的視覺編碼決策
      status: draft
    - to_course: 品牌策略與跨媒體整合專題（大三下，就業學程）
      artifact_name: brand_color_decision_table.md + color_intent_source_list.md + profile_version_log.csv
      format: Markdown + CSV
      produced_by_task: TASK-03/TASK-05
      consumed_for: 品牌策略課讀取意象詞彙、受眾語境、候選色排除理由與 profile 版本後，用於品牌識別規範、跨媒體素材色彩指定與供應商溝通檔案
      status: draft
    - to_course: 整合行銷傳播（大四上）
      artifact_name: campaign_color_qc_packet.zip
      format: ZIP containing Markdown, JSON, ICC profile record, measurement files
      produced_by_task: TASK-01/TASK-04/TASK-06
      consumed_for: 整合行銷傳播課讀取色彩風險表、輸出鏈路、燈箱觀察與 ΔE00 前後比較後，用於多接觸點素材的輸出驗收、供應商回報與修正決策
      status: draft
    - to_course: 畢業專題（大四上）
      artifact_name: final_project_color_reproducibility_dossier.zip
      format: ZIP containing source file index, design tokens, ICC/profile log, soft proof record, measurement files, revision log
      produced_by_task: TASK-02/TASK-05/TASK-06
      consumed_for: 畢業專題讀取來源檔索引、token 表、ICC/profile 紀錄、軟打樣設定、實體輸出樣本紀錄與修正再輸出紀錄後，用於專題展覽輸出、口試展示檔與製作廠商交付規格
      status: draft

# ── 契約 7｜平台可攜契約 ─────────────────────────────────────────
# 在不同 LLM 上如何維持最低一致性。降級但不偽裝。
portability_contract:
  principle: 能力受限時降低宣稱強度，不得以估算冒充計算（SKILL.md 第 6 節）

  degradation_rules:
    no_code_execution:
      trigger: 環境無法執行 Python
      must_not: [計算研究等級指標, 提供未標記之數值結果]
      must_do:
        - 提供可重現之公式或可直接複製之腳本呼叫指令
        - 所有數值結果標記 unverified
      required_statement: 本環境無法執行量化稽核，以下僅為方向性判斷，不得作為評分或研究依據。

    no_visual_input:
      trigger: 環境無法接收影像
      must_not: [宣稱已目視檢查, 以文字描述替代數值色彩資料]
      must_do:
        - 要求提供 hex／Lab／量測檔等數值色彩資料
        - 涉及外觀之判斷標記 not_assessable_without_visual

    no_file_access:
      trigger: 環境無法讀取 repo 檔案
      must_not: [宣稱已審閱完整檔案]
      must_do:
        - 只索取完成當前判斷所需之最小必要片段，並說明理由
        - 輸出標記 partial_input 並列出未讀取部分

  common_rules:
    statement_position: 降級聲明置於輸出最前，不得置於結尾或註腳
    failure_condition: 降級但未輸出聲明 → E-DEGRADE，補上聲明並重新標記結果
    no_relaxation: 不得因降級而省略失敗條件判定；證據不足即為未通過，不是待補

  minimum_consistency:
    # 任何平台皆須維持
    - 設備閘門（SKILL.md 第 2 節）
    - 證據完整性檢查（evidence_contract.completeness_rule）
    - 失敗條件總表（SKILL.md 第 9 節）

# ── 研究層 overlay（可插拔，預設關閉）────────────────────────────
research_overlay:
  enabled: false
  note: 本 skill 不得自行開啟，也不得建議特定研究問題（SKILL.md 第 7 節）
  blocked_until: [研究問題確定, primary_outcome 確定, 倫理程序完成]
  additional_fields_when_enabled:
    - group_assignment
    - primary_outcome
    - pre_post_measures
    - consent_status
    - anonymous_id
  undecided_by_instructor:
    # 對應 CONTEXT.md 第 8 節
    - 研究問題與 primary outcome
    - IRB 送件時程
    - 評分規準的維度與權重
    - 前後課程的具體交接物
