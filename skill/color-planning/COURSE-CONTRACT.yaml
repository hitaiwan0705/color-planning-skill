    registration_note: 報名極可能於開學一至兩週內截止，報考決定須於第 1 週處理
    unverified_note: 報名期間與團體報名截止日須以 115 年度初級簡章條文為準

# ── 週次計畫（18 週）───────────────────────────────────────────
# 這不是第八項契約，是前六項契約在本學期的排課實例。
# 契約規定「什麼算數」，本節只規定「哪一週做」。兩者衝突時以契約為準。
weekly_plan:
  meta:
    total_weeks: 18
    structure: 前 9 週色彩規劃與色彩管理主線（考前）／後 9 週色彩感知（7 週授課搭配進度交件、2 週自主學習報告）
    authority: 授課者定案 2026-09-05
    week_to_date_rule: 週次與日期之對應須由授課者以實際開學日核算後填入；本檔不得寫入未經核算之日期

  assumptions:
    - id: A1
      statement: 學生已修過色彩學與色彩度量學，前 9 週不重講基礎
      source: CONTEXT.md 第 1 節 學生先修狀態
      status: instructor_stated
    - id: A2
      statement: iPAS 115 年度初級第一次考試 2026-11-14 落在第 9 週或之前
      status: unverified
      verification_rule: 授課者須以實際開學日核算 11/14 為第幾週
      failure_condition: 若 11/14 早於第 9 週，須將 week 6 至 week 8 之量測與色彩管理內容前移，並回報受影響之 TASK 與交件日
    - id: A3
      statement: 每週一次課，客座場次佔用該週全部課堂時間
      status: instructor_stated

  guest_lectures:
    count_max: 3
    speakers: [吳瑞卿, 陳鴻興]
    scheduled_weeks: [2, 5]
    reserve_week: 9
    purpose: 色彩學與色彩度量學之複習，不新增本課評量要求
    rules:
      - 客座週不發新任務、不收新交件
      - 客座內容不得作為評量判準之唯一來源；判準一律回到 COURSE-CONTRACT 與工具輸出
      - 客座講題須於 week 1 診斷結果產出後再確認，避免重複學生已具備的內容
    unverified_note: "<!-- UNVERIFIED: 兩位講者之單位職稱、可授課週次與講題須經本人確認，未確認前不得對外公告 -->"

  # TASK-06 虛實輸出鏈的排課裁決（授課者 2026-09-05）
  task06_ruling:
    task_id: TASK-06
    decision: OPT-A
    decided_by: instructor
    decided_on: 2026-09-05
    action: TASK-06 併入後半，P1–P7 的觀察基底改為學生自己的 Mimaki 實體輸出，TASK-06 與 TASK-07 共用同一組樣本
    consequences_accepted:
      - 色彩感知模組由 7 個主題週壓縮為 5 個主題週；原「色適應」與「對比效應」合併於 week 11，原「觀察方法與判斷任務設計」併入 week 15 與 week 16
      - week 13、15、16 改為設備站週次（S5–S6、S7–S8、S9）
      - 依賴白墨、clear 與未確認媒材之活動仍為 BLOCKED，不因本裁決解除
      - 學期配分須重配，見 assessment_contract.rubric_dimensions.semester_weighting_draft
    chain_span:
      note: 一條龍九站跨越兩個 block，非後半獨有
      block_a: [S1 色票登錄 → week 3, S2 顯示器校正 → week 7, S3 工作色域 → week 7, S4 軟打樣 → week 8]
      block_b: [S5 媒材描述檔 → week 13, S6 第一次輸出 → week 13, S7 燈箱觀察 → week 15, S8 儀器量測 → week 15, S9 修正再輸出 → week 16]
    failure_condition: 任一設備站缺其產出檔即該站未完成，不得以下一站的結果反推補齊

  weeks:
    # ── Block A：色彩規劃與色彩管理主線（考前）──
