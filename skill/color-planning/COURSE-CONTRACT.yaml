# COURSE-CONTRACT.yaml — 色彩規劃與傳播應用｜七項契約
#
# 七項契約集中於本檔，不拆成多個 schema（CONTEXT.md 第 6 節第 3 條）。
# 本檔為課程契約：欄位結構、必填規則、驗證邏輯、失敗條件與課程實質內容。
#
# 執行指令見 SKILL.md。已定案事實見 CONTEXT.md，衝突時以 CONTEXT.md 為準。

meta:
  course_name: 色彩規劃與傳播應用
  institution: 中國文化大學 資訊傳播學系
  level: 大三上
  required: true
  version: 0.2.0-18week-scheduled
  status: content_filled    # skeleton | content_filled | classroom_ready
  classroom_ready: false    # 設備未確認項與交接草案仍須授課者核定
  context_source: CONTEXT.md
  skill_source: skill/color-planning/SKILL.md

# 全域必填規則：任一違反即本檔無效
global_rules:
  abstract_verbs_forbidden:
    # 能力描述不得使用下列詞彙，須編譯為五段式
    forbidden: [understand, apply, integrate, 理解, 應用, 整合, 熟悉, 掌握]
    replacement_form: [input_evidence, observable_behavior, deliverable, validation_rule, failure_condition]
    scope: 僅適用於 capability_contract.capabilities 之 input_evidence、observable_behavior、deliverable、validation_rule、failure_condition 欄位；課程名稱、專有名詞不適用
  external_fact_rule: 涉及外部事實者必須附可查證連結，查不到即標 UNVERIFIED，不得寫成肯定句
  equipment_rule: 未確認設備不得阻擋概念與方法教學；實際操作前依功能需求核對可用工具、媒材與安全條件。只有依賴未確認功能的實作步驟標 BLOCKED，並提供功能等價替代路徑
  scope_floor: 涵蓋範圍不得窄於 iPAS 初級三科（色彩學／色彩計畫實務／色彩管理）
  todo_marker: TODO(codex)
  blocked_marker: "<!-- BLOCKED: 待設備確認 -->"

# ── 契約 1｜能力契約 ─────────────────────────────────────────────
# 學生最後能獨立完成什麼。每條能力必須五段式，缺任一段即該條無效。
capability_contract:
  # ── 六層結構 ──
  # 契約以 layer: 1–6 引用這六層，但定義原本只寫在 CONTEXT.md，
  # 契約自己讀不到。2026-09-06 搬進來，讓 layer_range 有對應的語意。
  layer_definitions:
    1: {name: 色彩知覺, content: 視覺系統、色適應、對比、色覺差異, question: 人為什麼這樣看見顏色}
    2: {name: 色彩表徵, content: CIE XYZ、CIELAB、LCh、RGB、CMYK、OKLCH, question: 如何以可交換數值描述顏色}
    3: {name: 色彩意象, content: 語意差異、情感意象、文化語境、品牌人格, question: 如何把抽象意象轉譯成色彩}
    4: {name: 色彩量測, content: 分光量測、標準光源、觀察條件、ΔE, question: 如何證明兩色相同或不同}
    5: {name: 色彩管理, content: 校正、特性化、ICC、色域映射、軟打樣, question: 如何讓不同裝置盡量一致}
    6: {name: 虛實輸出, content: 螢幕、印刷、平台式噴墨、材質、照明、實體樣本, question: 數位設計如何可靠轉成實體}
  main_line:
    sequence: CIE XYZ → CIELAB／LCh → ΔE → ICC
    pantone_rule: Pantone 屬產業溝通與色票指定層，不得作為色彩科學推導的起點

  encoding_rule:
    required_fields: [id, layer, input_evidence, observable_behavior, deliverable, validation_rule, failure_condition]
    id_pattern: "CAP-[0-9]{2}"
    layer_range: [1, 6]
    failure_condition: 任一必填欄位缺漏、為空、或使用 global_rules.abstract_verbs_forbidden 所列詞彙

  ipas_alignment:
    source: CONTEXT.md 第 4 節
    source_url: https://ipd.nat.gov.tw/ipas/certification/CPM/exam-info
    rule: 每一科至少須對應一個 CAP 與一個 TASK；任一科無對應即觸發 E-SCOPE
    subjects:
      - subject: 科目一 色彩學
        capability_refs: [CAP-01, CAP-02, CAP-04]
        task_refs: [TASK-01, TASK-02, TASK-04]
        coverage_basis: 色彩知覺、色彩表徵、標準光源、觀察條件與 CIEDE2000 色差證據
        verification_rule: CAP/TASK 產物須含知覺風險表、色彩表徵對照表、量測條件表與 ΔE00 報告
        gap_note: 若 iPAS 115 年度正式簡章列出本表未含之色彩學細目，須補列；目前僅依 CONTEXT.md 已查證三科名稱比對
      - subject: 科目二 色彩計畫實務
        capability_refs: [CAP-02, CAP-03, CAP-06]
        task_refs: [TASK-02, TASK-03, TASK-06]
        coverage_basis: design token、色彩意象決策、候選色票取捨、媒介輸出限制與修正再輸出紀錄
        verification_rule: CAP/TASK 產物須含 design_token_table、色彩意象決策表、候選色票取捨紀錄與虛實輸出鏈路包
        gap_note: "<!-- UNVERIFIED: 科目二作答方式與是否配發實體色票須以 115 年正式簡章條文核對 -->"
      - subject: 科目三 色彩管理
        capability_refs: [CAP-04, CAP-05, CAP-06]
        task_refs: [TASK-04, TASK-05, TASK-06]
        coverage_basis: i1 Pro 量測、顯示器 OS 層 ICC、指定工作色域、軟打樣、媒材/設備描述檔與輸出後量測
        verification_rule: CAP/TASK 產物須含 i1_pro_measurement_file、i1Profiler_calibration_record、OS_ICC_profile_record、soft_proof_record 與 DeltaE00_before_after_report
        gap_note: 若 iPAS 115 年度正式簡章列出本表未含之色彩管理細目，須補列；目前僅依 CONTEXT.md 已查證三科名稱比對
    failure_condition: 任一 subject 缺 capability_refs、task_refs、verification_rule，或把 UNVERIFIED 項寫成肯定句 → E-SCOPE

    # ── 官方評鑑主題與評鑑內容（115 年度簡章 115.04 版 2.5 節）──
    # 逐條列出，供 scope_floor 比對。covered_in 為本學期實際排課位置；
    # 空值或 post_exam 者即為缺口，見下方 coverage_gap_analysis。
    official_syllabus:
      source: 115 年度色彩規劃管理師能力鑑定簡章（初級）115.04 版 2.5 節，授課者提供之官方 PDF
      source_url: https://ipd.nat.gov.tw/ipas/CPM/
      verified: true
      L11_色彩學:
        L111_色彩學基礎知識:
          L11101_認識色彩: {covered_in: [W02 客座①], status: guest_only}
          L11102_色彩視覺原理含色覺異常: {covered_in: [W02 客座①, W14], status: partial_post_exam}
          L11103_色與光: {covered_in: [W02 客座①, W05 客座②], status: guest_only}
          L11104_色彩視覺三要素: {covered_in: [W02 客座①], status: guest_only}
          L11105_表色體系: {covered_in: [W02 客座①, W03], status: partial}
          L11106_混色原理: {covered_in: [W02 客座①], status: guest_only}
        L112_色彩應用基礎知識:
          L11201_數位色彩概論: {covered_in: [W03], status: covered}
          L11202_色彩基本度量: {covered_in: [W05 客座②, W06], status: covered}
          L11203_色彩複製: {covered_in: [W08], status: covered}
          L11204_影像色彩處理與應用: {covered_in: [W09 自習清單], status: self_study}
          L11205_基礎色彩計畫: {covered_in: [W04], status: covered}
          L11206_數位色彩管理: {covered_in: [W07, W08], status: covered}
          L11207_基礎光電色彩: {covered_in: [W05 客座②, W09 自習清單], status: self_study}
        L113_色彩感覺:
          L11301_心理感覺_恆常性偏好情緒聯想: {covered_in: [W02 客座①, W04, W11], status: covered}
          L11302_色彩的可視度與注目性: {covered_in: [W04], status: covered}
          L11303_色彩對比與同化: {covered_in: [W04, W11], status: covered}
        L114_配色的基本法則:
          L11401_色調與配色: {covered_in: [W04], status: covered}
          L11402_以色相為主的配色: {covered_in: [W04], status: covered}
          L11403_以明度為主的配色: {covered_in: [W04], status: covered}
          L11404_以彩度為主的配色: {covered_in: [W04], status: covered}
      L12_色彩計畫實務:
        L121_色彩基礎實作:
          L12101_依三屬性排列色票樣: {covered_in: [W03], status: covered}
          L12102_色彩系統_孟塞爾NCS_PCCS_CIELAB: {covered_in: [W02 客座①, W03, W04], status: covered}
        L122_色彩計畫應用:
          L12201_依原理與計畫要求選色配色: {covered_in: [W04], status: covered}
      L13_色彩管理:
        L131_色彩量測:
          L13101_光譜與色溫: {covered_in: [W05 客座②], status: guest_only}
          L13102_光與視覺: {covered_in: [W05 客座②], status: guest_only}
          L13103_CIE色彩系統: {covered_in: [W03, W05 客座②], status: covered}
          L13104_量測儀器與原理: {covered_in: [W05 客座②, W06], status: covered}
          L13105_色差評估: {covered_in: [W06], status: covered}
        L132_色彩複製:
          L13201_複製原理: {covered_in: [W08], status: covered}
          L13202_視覺與照明特性: {covered_in: [W06, W15], status: partial_post_exam}
          L13203_顯示色彩複製原理: {covered_in: [W07], status: covered}
          L13204_攝影色彩複製原理: {covered_in: [W08], status: covered_concept}
          L13205_印刷色彩複製原理: {covered_in: [W08, W13], status: covered}
          L13206_紡織色彩複製原理: {covered_in: [W08], status: covered_concept}
          L13207_色彩材質與表面處理: {covered_in: [W08], status: covered_concept}
        L133_色彩管理系統應用:
          L13301_色彩管理原理: {covered_in: [W07], status: covered}
          L13302_色彩管理流程: {covered_in: [W07, W08], status: covered}
          L13303_ICC色彩管理系統: {covered_in: [W08], status: covered}
          L13304_色彩校正工具: {covered_in: [W07], status: covered}
          L13305_演色方式與轉換方法: {covered_in: [W08], status: covered}
          L13306_相關應用: {covered_in: [W08, W13], status: partial}
          L13307_基礎色外貌模式的概念: {covered_in: [W08, W12], status: covered}

    # ── scope_floor 比對結果 ──
    coverage_gap_analysis:
      verdict: REMEDIED_PENDING_RATIFICATION
      verdict_history:
        - {on: 2026-09-05, verdict: E-SCOPE_TRIGGERED, by: claude, note: 42 條細目中 14 條未涵蓋或排在考後}
        - {on: 2026-09-05, verdict: REMEDIED_PENDING_RATIFICATION, by: claude, note: 六項缺口皆已排入週次；補救為草案，須授課者核定}
      remedy_authority: claude_drafted
      ratified_by: instructor_only
      remedy_note: |
        授課者不在時，由 Claude 依本表原有之 proposed_remedy 逐條實施，改動 week 2、3、4、8、9。
        這是排課裁決，本應由授課者做。實施理由：授課者指示自行完成講義，而講義的涵蓋範圍
        無法在缺口未補的情況下決定；不補而寫，等於把缺口寫進教材。
        所有改動皆可逆，逐週記於 weekly_plan.weeks[].gap_remedy 與 syllabus_refs。
        授課者若不同意任一項，改動該週的 focus 與 syllabus_refs 即可，講義隨之調整。
      rule_violated: global_rules.scope_floor（涵蓋範圍不得窄於 iPAS 初級三科）
      requires_instructor_ruling: true
      blocking_for: 教材製作不得在裁決前宣稱已滿足考科涵蓋
      gaps:
        - id: GAP-01
          status: remedied_draft
          remedy_applied: W04 新增色調與配色、以色相／明度／彩度為主的配色四節
          severity: blocking
          items: [L11401, L11402, L11403, L11404]
          finding: 配色的基本法則整個評鑑主題完全未排入。這是科目一的四個細目，且是科目二配色實作的前提
          proposed_remedy: 指定客座① 講題涵蓋 L114，或將 W04 擴充為「配色法則與色彩意象」兩節
        - id: GAP-02
          status: remedied_draft
          remedy_applied: W03 新增依色相、明度、彩度三屬性排列色票之實體操作
          severity: blocking
          items: [L12101]
          finding: 依色相、明度、彩度排列色票（樣）未排入。科目二為實作測驗，且簡章載明搭配實體色票貼紙作答，此為該科核心操作
          proposed_remedy: W03 或 W04 加入實體色票排列練習；需確認系上是否有可供練習之色票組
        - id: GAP-03
          status: remedied_draft
          remedy_applied: W04 新增可視度與注目性、對比與同化之講授層；客座① 指定補強心理感覺
          severity: blocking
          items: [L11302, L11303, L11301]
          finding: 色彩感覺整個評鑑主題排在考後（W11、W12），科目一考前無涵蓋；L11302 可視度與注目性完全未排入
          proposed_remedy: 將 L113 的講授部分前移至 W04 或客座①，Block B 保留其觀察與資料層
        - id: GAP-04
          status: remedied_draft
          remedy_applied: W08 新增複製原理概覽一節，涵蓋攝影、紡織、材質與表面處理
          severity: structural
          items: [L13204, L13206, L13207]
          finding: 攝影、紡織色彩複製原理與色彩材質表面處理未排入；三者皆為科目三 L132 細目
          proposed_remedy: 併入 W08 作為概念層一節，或列入自習清單並提供指定讀物
        - id: GAP-05
          status: remedied_draft
          remedy_applied: W09 交付自習清單，涵蓋影像色彩處理與基礎光電色彩
          severity: structural
          items: [L11204, L11207]
          finding: 影像色彩處理與應用、基礎光電色彩未排入
          proposed_remedy: 列入自習清單；L11207 可由客座② 一併涵蓋
        - id: GAP-06
          status: remedied_draft
          remedy_applied: W08 新增印刷複製原理與基礎色貌模式之概念層
          severity: structural
          items: [L13205, L13307]
          finding: 印刷色彩複製原理與基礎色外貌模式排在考後（W13、W12）
          proposed_remedy: 於 W08 加入概念層說明，實作仍留在 Block B
      note: |
        本表只做比對與提案，不自行改動週次。GAP-01 至 GAP-03 為 blocking，
        在裁決前，weekly_plan 不得宣稱已滿足 coverage_before_exam。
      failure_condition: 未裁決即產生宣稱已涵蓋 iPAS 三科之輸出 → 該輸出作廢


  capabilities:
    # 涉及 ⚠️ 設備者，failure_condition 前加 blocked_marker。
    - id: CAP-01
      layer: 1
      input_evidence: 指定色票、前景背景組合、版面截圖、刺激條件、觀察者紀錄、AI 使用揭露
      observable_behavior: 標出色適應、同時對比、連續對比與色覺差異可能改變判讀的位置，並分開記錄 WCAG 對比與 SC 1.4.1「僅以顏色傳達」檢核
      deliverable: 色彩知覺風險表、觀察條件紀錄、色覺差異風險清單、SC 1.4.1 人工檢核表
      validation_rule: 每一筆風險須連到截圖座標或色票 ID；對比數值須可追溯至 color_audit.py；SC 1.4.1 不得以對比數值代替；WCAG 2.2 來源註記 https://www.w3.org/TR/WCAG22/
      failure_condition: 缺任一交付物、以主觀喜好代替觀察條件、或把對比通過寫成 SC 1.4.1 通過 → 未通過
    - id: CAP-02
      layer: 2
      input_evidence: 色票清單、原始設計檔、色彩空間宣告、ICC profile、工具輸出 JSON、AI 使用揭露
      observable_behavior: 將同一色票以 CIE XYZ、CIELAB、LCh、RGB、CMYK、OKLCH 中任務指定格式記錄，標明來源 profile 與不可直接比較的跨空間欄位
      deliverable: design token 表、色彩表徵對照表、色彩空間與 profile 版本紀錄、工具輸出附件
      validation_rule: 每個 token 須有唯一 ID、色彩空間、數值、來源檔、profile 名稱與版本；跨空間轉換須保留工具輸出或軟體匯出紀錄；不得以 Pantone 作為色彩科學起點
      failure_condition: token 缺 ID 或 profile、RGB/CMYK/Lab 數值未標來源、或跨色彩空間直接比較未註記限制 → 未通過
    - id: CAP-03
      layer: 3
      input_evidence: 品牌或傳播情境簡報、受眾描述、語意差異量表、文化語境資料、候選色票、AI 使用揭露
      observable_behavior: 將意象詞彙與品牌人格對應到候選色票，記錄保留與排除理由，並標出文化語境風險
      deliverable: 色彩意象決策表、語意差異摘要、候選色票取捨紀錄、文化語境風險註記
      validation_rule: 每個入選色須至少連到一筆意象證據與一筆排除替代色理由；外部文化或標準事實須附來源，查不到須標 UNVERIFIED
      failure_condition: 只寫情緒形容詞而無證據、未列替代色排除理由、或將未查證文化意義寫成肯定句 → 未通過
    - id: CAP-04
      layer: 4
      input_evidence: 實體樣本、i1 Pro 2 或 i1 Pro 3 量測檔、標準光源紀錄、觀察角度、儀器型號、AI 使用揭露
      observable_behavior: 在指定光源與觀察條件下量測樣本，使用 CIEDE2000 報告色差，並把視覺觀察與儀器紀錄分欄
      deliverable: 原始量測檔、量測條件表、ΔE00 報告、視覺觀察紀錄、異常值處理紀錄
      validation_rule: 每個 ΔE00 數值須可追溯至 i1 Pro 量測檔或 color_audit.py；報告須註明 CIEDE2000 公式版本，不得與 CIE76 混用；D50/D65 燈箱可用但型號等級不得肯定
      failure_condition: 缺原始量測檔、量測條件未載光源或觀察角度、以目測代替 ΔE00、或宣稱未核對之燈箱等級 → 未通過
    - id: CAP-05
      layer: 5
      input_evidence: 顯示器型號、i1Profiler 校正紀錄、OS 層 ICC profile、工作色域設定、軟打樣截圖、AI 使用揭露
      observable_behavior: 以 i1 Pro 2 或 i1 Pro 3 搭配 i1Profiler 建立 OS 層顯示器 ICC profile，指定工作色域，記錄軟打樣與色域映射設定
      deliverable: 顯示器校正紀錄、ICC profile 檔名與版本表、工作色域設定表、軟打樣設定表、色域外色彩清單
      validation_rule: 顯示器須限 BenQ PD2705Q 或 PD2706QN；校色路徑須為 i1Profiler 到 OS 層 ICC；不得寫入 monitor LUT 或宣稱 AQCOLOR Pilot 硬體校色；BenQ/X-Rite 來源見 CONTEXT.md 第 2 節連結
      failure_condition: 缺 ICC profile、未載工作色域、將軟體校色寫成硬體校色、或使用 CONTEXT.md 未列顯示器 → 未通過
    - id: CAP-06
      layer: 6
      input_evidence: 原始設計檔、工作色域設定、顯示器 ICC、軟打樣紀錄、Mimaki 輸出設定、媒材/設備描述檔、實體樣本、燈箱觀察紀錄、i1 Pro 量測檔、修正紀錄、AI 使用揭露
      observable_behavior: 依序完成數位設計、顯示器校正、指定工作色域、軟打樣、媒材/設備描述檔記錄、Mimaki 實體輸出、D50/D65 燈箱觀察、儀器量測、視覺評估、修正再輸出
      deliverable: 虛實輸出鏈路包、第一次輸出樣本、修正後輸出樣本、ΔE00 前後比較報告、視覺評估表、再輸出修改紀錄
      validation_rule: 鏈路十步驟不得缺項或改序；Mimaki 輸出不得超過 300×420 mm 與 50 mm 厚度；媒材名稱若未由授課者確認，該媒材指定須標 BLOCKED；白墨、clear 或螢光燈管活動須標 BLOCKED
      failure_condition: 缺任一鏈路證據、未交修正後樣本、未載媒材/設備描述檔、或使用未確認白墨/clear/TL84 做肯定教學 → 未通過

    # ── 後半 9 週 色彩感知模組（week 10–18）新增之能力 ──
    - id: CAP-07
      layer: 1
      input_evidence: 指定色票與版面、觀察條件紀錄（光源、背景色、觀察距離、觀察時間）、觀察者當下適應狀態自述、color_audit.py 輸出、涉及實體樣本時之 i1 Pro 量測檔、AI 使用揭露
      observable_behavior: 對同一組色彩分別記錄儀器數值與人眼判讀，標出兩者不一致的位置，並指名該不一致可歸因於哪一個機制（同色異譜、適應狀態、背景與同時對比、觀察者差異），同時說明排除其餘機制的理由
      deliverable: 感知落差對照表、觀察條件紀錄、機制歸因說明、排除理由紀錄、工具與儀器輸出附件
      validation_rule: 每一筆落差須同時具備儀器數值與人眼判讀，缺一不成立；歸因須指名單一機制並附排除其餘機制之理由；ΔE00 須追溯至 color_audit.py 或 i1 Pro 量測檔並註明 CIEDE2000
      failure_condition: 只有人眼判讀而無儀器數值、只有儀器數值而無觀察條件紀錄、或歸因未附排除理由 → 未通過
    - id: CAP-08
      layer: 1
      input_evidence: 自選之色彩感知問題、CAP-07 累積之落差資料、自行補充之觀察或量測資料、外部來源清單、AI 使用揭露
      observable_behavior: 提出一個可由所附資料回答的色彩感知問題，寫出觀察條件與判斷方法，報告資料結果，並列出本次資料無法回答的部分
      deliverable: 報告本文（問題、方法、觀察條件、資料、限制）、簡報檔、錄製的口頭發表、原始資料檔、外部來源清單、AI 使用揭露
      validation_rule: 問題須可由所附資料回答；每個數值主張須追溯至工具輸出或儀器量測檔；外部事實須附可查證來源，查不到須標 UNVERIFIED；限制章節不得為空
      failure_condition: 問題無法由所附資料回答、限制章節為空、以文獻敘述替代自身觀察資料、或將 AI 生成內容列為事實來源 → 未通過

    # ── 傳播為主體（week 10 起，授課者裁示 D5）新增之能力 ──
    # D5 之前，後半九週只有感知與量測；傳播只出現在 ASSIGN-03 的一句備註裡。
    # 備註不是執行者：沒有這一條，「以傳播為主體」在契約裡沒有任何欄位擋得住
    # 一份純技術紀錄。
    - id: CAP-09
      layer: 3
      input_evidence: 傳播任務簡報（訊息、閱聽人、接觸點清單）、各接觸點之媒介與觀看條件紀錄、CAP-02 之 design token 表、CAP-05 之顯示器與軟打樣紀錄、CAP-07 之感知落差資料、AI 使用揭露
      observable_behavior: 對同一則訊息列出至少三個接觸點（校正過的顯示器、Mimaki 實體輸出、標準燈箱下之實體展示），逐一寫出該接觸點的色彩負責哪一項傳播功能（辨識、區隔、警示、層級、情緒定調），並指出哪一項功能會因該處的媒介或觀看條件而失效
      deliverable: 接觸點—訊息—色彩功能對照表、跨接觸點色彩規範書（含 ΔE00 容差與替代方案）、失效點清單與其證據、閱聽人與觀看條件假設表
      validation_rule: 每個接觸點須載明媒介、觀看條件與色彩空間；每一筆失效主張須連到 color_audit.py 輸出、i1 Pro 量測檔或 CAP-07 之落差紀錄；容差須以 ΔE00 表示並註明 CIEDE2000；閱聽人條件屬推測者須標 UNVERIFIED
      failure_condition: 接觸點少於三個、色彩功能只寫「好看」或「符合品牌調性」而無可觀察判準、失效主張無證據來源、或以單一裝置的數值代表全部接觸點 → 未通過

# ── 契約 2｜任務契約 ─────────────────────────────────────────────
# 在什麼情境、限制與角色下完成。
task_contract:
  encoding_rule:
    required_fields: [id, capability_refs, scenario, role, constraints, equipment_required, duration, submission_channel]
    id_pattern: "TASK-[0-9]{2}"
    validation_rule: capability_refs 必須指向存在的 CAP id；equipment_required 每項須在 CONTEXT.md 第 2 節出現
    failure_condition: 參照不存在的能力、或要求 CONTEXT.md 未記載之設備 → 該任務作廢
    - id: TASK-09
      capability_refs: [CAP-09]
      scenario: 為一則指定的傳播訊息建立跨接觸點的色彩規範，接觸點須同時涵蓋校正過的顯示器、Mimaki 實體輸出與標準燈箱下的實體展示
      role: 傳播色彩系統規劃者
      constraints: 觀看條件不得假設，須現場記錄；燈箱僅得使用 D50／D65，型號等級寫「待核對」；容差一律以 ΔE00 表示；不得以品牌指南既有色票作為未經量測的一致性證據
      equipment_required: [benq_pd2705q, display_profiling_via_i1profiler, mimaki_ujf_3042fx_body, light_booth_d50_d65, i1_pro_2, i1_pro_3]
      duration: 4 週（week 10–13）
      submission_channel: Microsoft Teams（授課者指定，2026-09-06）

  equipment_gate:
    # 對應 SKILL.md 第 2 節。狀態為 unverified 者，相關任務必須標 BLOCKED。
    confirmed:
      - i1_pro_2
      - i1_pro_3
      - mimaki_ujf_3042fx_body
      - benq_pd2705q
      - benq_pd2706qn
      - display_profiling_via_i1profiler  # i1 Pro 2/3 + i1Profiler → OS 層 ICC
      - light_booth_d50_d65
    unverified:
      - light_booth_model         # 研判為 Judge QC，須核對機身銘牌
      - judge_qc_fluorescent_lamp # CWF／TL84／U30 未確認，同色異譜活動依賴此項
      - mimaki_white_clear_ink    # 白墨與 clear 是否已安裝未確認
    unavailable:
      # 已查證確定不具備者。標此類之活動一律 BLOCKED，且不得以「待確認」表述。
      - monitor_hardware_calibration  # PD 系列僅 software calibration，硬體校色限 SW 系列
    undecided: [teaching_venue]
    rule: 任務之 equipment_required 若含 unverified、unavailable 或 undecided 項目，必須標 blocked_marker

  tasks:
    - id: TASK-01
      capability_refs: [CAP-01]
      scenario: 檢查資訊圖表或品牌版面中的色彩知覺風險，分別處理色適應、對比、色覺差異與 WCAG SC 1.4.1
      role: 色彩規劃稽核者
      constraints: 不得以個人偏好作為判斷；對比數值須由 color_audit.py 產生；SC 1.4.1 以人工檢核表記錄
      equipment_required: []
      duration: 1-2 週
      submission_channel: Microsoft Teams（授課者指定，2026-09-06）
    - id: TASK-02
      capability_refs: [CAP-02]
      scenario: 將傳播設計色票轉成可交換的色彩資料與 design token，標明色彩空間、profile 與版本
      role: 色彩資料建檔者
      constraints: 主線須從 CIE XYZ 到 CIELAB/LCh 到 ΔE 到 ICC；Pantone 只能作為產業溝通或色票指定欄位
      equipment_required: []
      duration: 1-2 週
      submission_channel: Microsoft Teams（授課者指定，2026-09-06）
    - id: TASK-03
      capability_refs: [CAP-03]
      scenario: 為品牌或傳播情境建立色彩意象決策表，將語意差異、文化語境與候選色票連成證據鏈
      role: 色彩計畫提案者
      constraints: 外部文化、標準或產業事實須附連結；查不到須標 UNVERIFIED；不得把 AI 產生內容寫成事實來源
      equipment_required: []
      duration: 2 週
      submission_channel: Microsoft Teams（授課者指定，2026-09-06）
    - id: TASK-04
      capability_refs: [CAP-04]
      scenario: 以 i1 Pro 2 或 i1 Pro 3 量測實體樣本，在 D50/D65 標準燈箱下記錄視覺觀察，產出 ΔE00 報告
      role: 色彩量測記錄者
      constraints: 燈箱可使用 D50/D65；型號與等級須寫「待核對」；不得假設 TL84、CWF 或 U30 存在
      equipment_required: [i1_pro_2, i1_pro_3, light_booth_d50_d65]
      duration: 2 週
      submission_channel: Microsoft Teams（授課者指定，2026-09-06）
    - id: TASK-05
      capability_refs: [CAP-05]
      scenario: 對 BenQ PD2705Q 或 PD2706QN 走 i1Profiler 到 OS 層 ICC 的顯示器校正與軟打樣設定
      role: 色彩管理操作者
      constraints: 只允許 software calibration；不得寫入 monitor LUT；不得使用 AQCOLOR Pilot 作為本課校色路徑
      equipment_required: [benq_pd2705q, benq_pd2706qn, display_profiling_via_i1profiler, i1_pro_2, i1_pro_3]
      duration: 2 週
      submission_channel: Microsoft Teams（授課者指定，2026-09-06）
    - id: TASK-06
      capability_refs: [CAP-06]
      scenario: 完成虛實輸出完整鏈：數位設計 → 顯示器校正 → 指定工作色域 → 軟打樣 → 媒材/設備描述檔 → 實體輸出 → 標準燈箱觀察 → 儀器量測 → 視覺評估 → 修正再輸出
      role: 虛實輸出品質記錄者
      constraints: "Mimaki UJF-3042FX 輸出不得超過 300×420 mm 與 50 mm 厚度；不得指定 CONTEXT.md 未確認媒材；白墨、clear、螢光燈管與固定教室配置相關活動一律標 <!-- BLOCKED: 待設備確認 -->"
      equipment_required: [mimaki_ujf_3042fx_body, light_booth_d50_d65, i1_pro_2, i1_pro_3, benq_pd2705q, benq_pd2706qn, display_profiling_via_i1profiler]
      duration: 3-4 週（OPT-A 裁決後排入 week 10–16，與 TASK-07 共用樣本；見 weekly_plan.task06_ruling）
      submission_channel: Microsoft Teams（授課者指定，2026-09-06）

    # ── 後半 9 週 色彩感知模組（week 10–18）新增之任務 ──
    - id: TASK-07
      capability_refs: [CAP-07]
      scenario: 以七週的進度交件累積一份感知落差資料集，每週新增一個機制的觀察
      role: 色彩感知觀察記錄者
      constraints: "每週僅新增當週機制之觀察，不得回頭改寫前週資料（改寫須另開修訂紀錄）；量化數值一律由 color_audit.py 或 i1 Pro 產生；同色異譜觀察限用 D50/D65，依賴螢光燈管者標 <!-- BLOCKED: 待設備確認 -->"
      equipment_required: [light_booth_d50_d65, i1_pro_2, i1_pro_3]
      duration: 7 週（week 10–16，每週一次進度交件 P1–P7）
      submission_channel: Microsoft Teams（授課者指定，2026-09-06）
      merged_with:
        task_id: TASK-06
        rule: TASK-07 的觀察基底即 TASK-06 的輸出樣本，兩者共用同一組實體樣本與同一份量測檔；任一方缺件，兩方皆不成立
        source: weekly_plan.task06_ruling（OPT-A）
      progressive_submissions:
        - id: P1
          week: 10
          adds: 儀器數值與人眼判讀的第一組對照，含完整觀察條件紀錄，並登錄本模組要輸出的那組色
        - id: P2
          week: 11
          adds: 同一組色彩在不同適應狀態與不同背景下的判讀差異
        - id: P3
          week: 12
          adds: 色貌屬性的分欄記錄，明度／明亮度／彩度／飽和度分開登錄
        - id: P4
          week: 13
          adds: 第一次實體輸出樣本的觀察紀錄，含媒材與設備描述檔欄位
        - id: P5
          week: 14
          adds: 色覺差異情境下的可區辨性，含 color_audit.py 之 cvd 情境輸出
        - id: P6
          week: 15
          adds: 燈箱觀察與儀器量測的對照，含判斷任務參數（觀察者人數、呈現順序、重複次數、參考條件）
        - id: P7
          week: 16
          adds: 修正後樣本與第一次樣本的前後對照，落差歸因並與前六週紀錄比對
      failure_condition: 任一進度交件缺當週新增內容，或以前週資料充抵 → 該次未通過，不得於學期末補交合併
    - id: TASK-08
      capability_refs: [CAP-08]
      scenario: 兩週自主學習，就 TASK-07 累積的資料提出並回答一個色彩感知問題，並將口頭發表錄製成可回溯成果
      role: 色彩感知報告撰寫者
      constraints: W17–W18 不排課，授課者提供固定 office hour；提交書面報告、簡報檔與錄製的口頭發表，不另排現場發表；報告須含限制章節；不得以 AI 生成內容作為事實來源；不得引用未標示可信度等級之非官方筆記作為判準；學習問卷自願且不計分，影片公開授權另行取得
      equipment_required: []
      duration: 2 週（week 17–18）
      submission_channel: Microsoft Teams（授課者指定，2026-09-06）
      presentation_mode: 非同步錄製口頭發表；W18 不恢復實體上課

  schedule_constraint:
    # 由 CONTEXT.md 第 4 節導出，非課程內容，Codex 不得更動。
    exam_date: 2026-11-14
    rule: iPAS 考科對應內容須於 2026-11-14 前授畢
    coverage_before_exam:
      required_for_ipas_subjects:
        - subject: 科目一 色彩學
          task_refs: [TASK-02, TASK-04]
          post_exam_reinforcement: TASK-01
          coverage_note: 依 CONTEXT.md 第 1 節學生先修狀態，科目一之基礎由先修課程與客座複習（week 2、week 5）承擔；TASK-01 色彩知覺稽核移至後半感知模組 week 14
          failure_condition: 若先修狀態或客座場次未落實，本科考前涵蓋即不成立，須回報缺口，不得以「學生應已學過」代替
        - subject: 科目二 色彩計畫實務
          task_refs: [TASK-02, TASK-03]
          post_exam_reinforcement: TASK-06
          unverified_note: "<!-- UNVERIFIED: 科目二作答方式與是否須完整實體輸出鏈，須以 115 年正式簡章條文核對 -->"
        - subject: 科目三 色彩管理
          task_refs: [TASK-04, TASK-05]
          post_exam_reinforcement: TASK-06
      post_exam_reinforcement_tasks: [TASK-06]
      scope_gap_ref: ipas_alignment.coverage_gap_analysis
      scope_gap_effect: GAP-01 至 GAP-03 未裁決前，本節不得被引用為「已滿足考前涵蓋」之依據
      feasibility_status: requires_instructor_scheduling
      failure_condition: 若 TASK-02 至 TASK-05 無法於 2026-11-14 前授畢，須標需授課者裁決；不得宣稱已滿足考前涵蓋
    registration_note: 報名極可能於開學一至兩週內截止，報考決定須於第 1 週處理
    unverified_note: 報名期間與團體報名截止日須以 115 年度初級簡章條文為準

# ── 週次計畫（18 週）───────────────────────────────────────────
# 這不是第八項契約，是前六項契約在本學期的排課實例。
# 契約規定「什麼算數」，本節只規定「哪一週做」。兩者衝突時以契約為準。
weekly_plan:
  meta:
    total_weeks: 18
    structure: 前 9 週色彩規劃與色彩管理主線（考前）／後 9 週色彩感知（7 週授課搭配進度交件、2 週自主學習報告）
    authority: 授課者定案 2026-09-05
    week_to_date_rule: 週次與日期之對應須由授課者以實際開學日核算後填入；本檔不得寫入未經核算之日期

  assumptions:
    - id: A1
      statement: 學生已修過色彩學與色彩度量學，前 9 週不重講基礎
      source: CONTEXT.md 第 1 節 學生先修狀態
      status: instructor_stated
    - id: A2
      statement: iPAS 115 年度初級第一次考試 2026-11-14 落在第 9 週或之前
      status: unverified
      verification_rule: 授課者須以實際開學日核算 11/14 為第幾週
